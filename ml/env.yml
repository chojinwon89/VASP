# Conda environment for the MLIP fine-tuning / active-learning starter kit.
#
#   conda env create -f ml/env.yml
#   conda activate goad-ml
#
# Notes
# -----
# * Install the Torch build that matches your CUDA (the pins below are CPU-safe;
#   on a GPU node use the pytorch-cuda line and drop cpuonly).
# * `sevenn` pulls torch-geometric; if pip struggles, install torch first, then
#   `pip install sevenn`.
# * scikit-optimize / ax-platform / botorch are only needed for the Bayesian
#   optimization phase — comment them out for a lean fine-tune-only setup.
name: goad-ml
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - matplotlib
  - pandas
  - scikit-learn
  - ase>=3.23
  - pymatgen
  - rdkit
  # - pytorch-cuda=12.1   # uncomment on a GPU node (and remove cpuonly)
  - pytorch
  - cpuonly
  - pip:
      - sevenn                # SevenNet: training + SevenNetCalculator
      - scikit-optimize       # simple Bayesian optimization
      - ax-platform           # advanced BO (adds botorch + gpytorch)
      - matminer              # composition / structure descriptors
      - wandb                 # optional training dashboards
